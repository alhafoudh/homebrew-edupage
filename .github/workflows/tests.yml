name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Homebrew on Apple silicon and Intel, Linuxbrew on x64 and arm64.
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]

    steps:
      # Also taps this checkout as alhafoudh/edupage.
      - uses: Homebrew/actions/setup-homebrew@main

      - run: brew style alhafoudh/edupage

      - run: brew install --build-from-source --verbose alhafoudh/edupage/edupage-cli

      - run: brew test --verbose alhafoudh/edupage/edupage-cli

      - run: brew audit --strict alhafoudh/edupage/edupage-cli
